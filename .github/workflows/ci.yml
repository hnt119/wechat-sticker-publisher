name: package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: python -m build
      - name: Build the public example offline
        run: |
          cp -R examples/sample-album "$RUNNER_TEMP/sample"
          wechat-sticker --project "$RUNNER_TEMP/sample" validate
          wechat-sticker --project "$RUNNER_TEMP/sample" build --offline --release ci
