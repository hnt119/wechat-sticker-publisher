[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-sticker-publisher"
version = "0.2.1"
description = "An offline-first CLI and portable Agent Skill for preparing, validating, and packaging WeChat sticker albums."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "WeChat Sticker Publisher contributors"}]
dependencies = ["Pillow>=11,<13", "PyYAML>=6,<7"]
keywords = ["wechat", "stickers", "agent-skills", "image-processing", "offline"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.urls]
Repository = "https://github.com/hnt119/wechat-sticker-publisher"
Documentation = "https://github.com/hnt119/wechat-sticker-publisher/blob/main/docs/creator-guide.md"
Issues = "https://github.com/hnt119/wechat-sticker-publisher/issues"
Changelog = "https://github.com/hnt119/wechat-sticker-publisher/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=2,<3"]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
wechat-sticker = "wechat_sticker_publisher.cli:main"

[project.entry-points."wechat_sticker_publisher.artwork"]
openai-images = "wechat_sticker_publisher.optional_openai:OpenAIImages"

[tool.setuptools]
packages = ["wechat_sticker_publisher", "wechat_sticker_publisher.skill_data", "wechat_sticker_publisher.skill_data.references"]

[tool.setuptools.package-dir]
"" = "src"
"wechat_sticker_publisher.skill_data" = ".agents/skills/wechat-sticker-publisher"

[tool.setuptools.package-data]
"wechat_sticker_publisher.skill_data" = ["SKILL.md"]
"wechat_sticker_publisher.skill_data.references" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
