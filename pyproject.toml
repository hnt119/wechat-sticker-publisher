[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-sticker-publisher"
version = "0.1.1"
description = "Prepare and verify WeChat sticker albums offline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "WeChat Sticker Publisher contributors"}]
dependencies = ["Pillow>=11,<13", "PyYAML>=6,<7"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
wechat-sticker = "wechat_sticker_publisher.cli:main"

[project.entry-points."wechat_sticker_publisher.artwork"]
openai-images = "wechat_sticker_publisher.optional_openai:OpenAIImages"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
